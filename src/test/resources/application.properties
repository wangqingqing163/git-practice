spring.application.name=bookstore-test
spring.main.web-application-type=servlet

# Upload path for mock tests
upload.path=D:/uploads/bookstore/

# JWT config for AuthInterceptor tests
jwt.secret=bookstore-jwt-secret-key-2026-must-be-at-least-256-bits-for-hs256-security
jwt.expiration=86400000

# Disable database auto-configuration for unit tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration